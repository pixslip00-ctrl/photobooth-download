<!DOCTYPE html>
<html lang="en">
<head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Download Your Photo</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: sans-serif;
      gap: 20px;
    }
    h1 { color: #fff; font-size: 22px; text-align: center; font-weight: 700; }
    p  { color: #aaa; font-size: 14px; text-align: center; }
    .photos {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }
    .photo-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 140px;
      max-width: 280px;
    }
    .photo-card img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    }
    .photo-card img.bw { filter: grayscale(100%); }
    .label {
      color: #aaa;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }
    .btn.bw-btn { background: #444; color: #fff; }
    .btn.gif-btn { background: #6c5ce7; color: #fff; }
    .btn.live-btn { background: #777; color: #fff; }
    .live-wrap { position: relative; width: 100%; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,0.5); background: #111; }
    .live-wrap video, .live-wrap img.frame { position: absolute; }
    .live-plain { width: 100%; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,0.5); background: #000; }
    .btn:active { opacity: 0.8; }
    .hint { color: #555; font-size: 12px; margin-top: -8px; }
    #expired { display: none; color: #f44336; font-size: 16px; text-align: center; }
    canvas { display: none; }
  </style>
</head>
<body> <h1>Your Photo is Ready!</h1> <p>Choose your preferred version</p> <div class="photos"> <div class="photo-card"> <p class="label">Colored</p> <!-- No crossorigin here — iOS long-press save works normally --> <img id="photoColor" alt="Colored photo" /> <button class="btn" onclick="downloadColor()">Download Color</button> </div> <div class="photo-card"> <p class="label">Black & White</p> <!-- src will be replaced with actual B&W data URL after load --> <img id="photoBW" alt="B&W photo" /> <button class="btn bw-btn" onclick="downloadBW()">Download B&W</button> </div> <div class="photo-card" id="gifCard" style="display:none"> <p class="label">GIF</p> <img id="photoGif" alt="Animated GIF" /> <button class="btn gif-btn" onclick="downloadGif()">Download GIF</button> </div> <div class="photo-card" id="liveCard" style="display:none"> <p class="label">Live</p> <div id="liveWrap"></div> <button class="btn live-btn" onclick="downloadVid()">Download Video</button> </div> </div> <p class="hint">iOS: press & hold the photo → Save to Photos</p> <p id="expired">This photo has expired (24 hours).</p> <canvas id="canvas"></canvas> <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script> <script> const params   = new URLSearchParams(window.location.search);
    const imgUrl   = params.get('img');
    const gifUrl   = params.get('gif');
    const colorImg = document.getElementById('photoColor');
    const bwImg    = document.getElementById('photoBW');

    if (gifUrl) {
      const gc = document.getElementById('gifCard');
      const gi = document.getElementById('photoGif');
      gc.style.display = 'flex';
      gi.onerror = () => { gc.style.display = 'none'; };
      gi.src = gifUrl;
    }

    const liveUrl   = params.get('live');
    const vidsStr   = params.get('vids');
    const frameUrl  = params.get('frame');
    const slotsStr  = params.get('slots');
    const layout    = params.get('layout');
    const headerUrl = params.get('header');
    const footerUrl = params.get('footer');
    const vidUrls   = vidsStr ? vidsStr.split(',').map(decodeURIComponent).filter(Boolean) : [];

    const allVideos = [];
    function mkVideo(src) {
      const v = document.createElement('video');
      v.src = src;
      v.preload = 'auto';
      v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true;
      v.onerror = () => { v.style.background = '#c0392b'; };
      allVideos.push(v);
      v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', ''); v.setAttribute('muted', '');
      return v;
    }

    function gridCols() { return (layout === '2x2' || layout === '3x2') ? 2 : 1; }
    function cellAspect() { return layout === '3-vertical' ? (9 / 16) : 1; }

    if (liveUrl) {
      // App already composited one MP4 — just show + download it (works on any phone).
      const card = document.getElementById('liveCard');
      const wrap = document.getElementById('liveWrap');
      card.style.display = 'flex';
      wrap.style.width = '100%';
      const v = mkVideo(liveUrl);
      v.className = 'live-plain';
      v.onerror = () => { card.style.display = 'none'; };
      wrap.appendChild(v); v.play().catch(() => {});
    } else if (vidUrls.length > 0) {
      const card = document.getElementById('liveCard');
      const wrap = document.getElementById('liveWrap');
      card.style.display = 'flex';

      const slots = slotsStr
        ? slotsStr.split(';').map(s => s.split(',').map(Number))
        : null;

      // Sandwich / grid template: header image + video grid + footer image, as one.
      function renderTemplate() {
        wrap.className = '';
        wrap.style.width = '100%';
        wrap.style.background = '#fff';
        wrap.style.borderRadius = '10px';
        wrap.style.overflow = 'hidden';
        wrap.style.boxShadow = '0 6px 24px rgba(0,0,0,0.5)';
        wrap.innerHTML = '';

        if (headerUrl) {
          const h = new Image();
          h.src = headerUrl; h.style.width = '100%'; h.style.display = 'block';
          wrap.appendChild(h);
        }

        const grid = document.createElement('div');
        grid.style.display = 'grid';
        grid.style.gridTemplateColumns = 'repeat(' + gridCols() + ', 1fr)';
        grid.style.gap = '6px';
        grid.style.padding = '6px';
        const asp = cellAspect();
        vidUrls.forEach(src => {
          const cell = document.createElement('div');
          cell.style.position = 'relative';
          cell.style.width = '100%';
          cell.style.paddingTop = (asp * 100) + '%';
          const v = mkVideo(src);
          v.style.position = 'absolute'; v.style.left = '0'; v.style.top = '0';
          v.style.width = '100%'; v.style.height = '100%'; v.style.objectFit = 'cover';
          v.style.borderRadius = '3px';
          cell.appendChild(v); grid.appendChild(cell); v.play().catch(() => {});
        });
        wrap.appendChild(grid);

        if (footerUrl) {
          const f = new Image();
          f.src = footerUrl; f.style.width = '100%'; f.style.display = 'block';
          wrap.appendChild(f);
        }
      }

      if (frameUrl && slots && slots.length >= vidUrls.length) {
        // Full-design: videos inside the frame's slots, frame on top.
        wrap.className = 'live-wrap';
        const frame = new Image();
        frame.className = 'frame';
        frame.onload = () => {
          const aspect = frame.naturalWidth > 0 ? frame.naturalHeight / frame.naturalWidth : 1.4;
          const W = wrap.clientWidth || 260;
          const H = W * aspect;
          wrap.style.height = H + 'px';
          vidUrls.forEach((src, i) => {
            const p = slots[i]; const cx = p[0], cy = p[1], w = p[2], h = p[3];
            const v = mkVideo(src);
            v.style.left = ((cx - w / 2) * W) + 'px';
            v.style.top  = ((cy - h / 2) * H) + 'px';
            v.style.width = (w * W) + 'px';
            v.style.height = (h * H) + 'px';
            v.style.objectFit = 'cover';
            wrap.appendChild(v); v.play().catch(() => {});
          });
          frame.style.left = '0'; frame.style.top = '0';
          frame.style.width = W + 'px'; frame.style.height = H + 'px';
          frame.style.pointerEvents = 'none';
          wrap.appendChild(frame);
        };
        frame.onerror = renderTemplate;
        frame.src = frameUrl;
      } else {
        renderTemplate();
      }
    }

    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }

    if (imgUrl) {
      colorImg.src = imgUrl;
      colorImg.onerror = () => {
        document.querySelectorAll('.photo-card').forEach(el => el.style.display = 'none');
        document.getElementById('expired').style.display = 'block';
      };

      // Load a hidden crossorigin copy just to generate the B&W data URL
      // Then set it as bwImg.src — so iOS long-press saves actual B&W pixels
      const helperLoad = new Image();
      helperLoad.crossOrigin = 'anonymous';
      helperLoad.onload = function() {
        try {
          const canvas  = document.getElementById('canvas');
          canvas.width  = helperLoad.naturalWidth;
          canvas.height = helperLoad.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(helperLoad, 0, 0);
          const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
          for (let i = 0; i < data.data.length; i += 4) {
            const g = data.data[i]*0.299 + data.data[i+1]*0.587 + data.data[i+2]*0.114;
            data.data[i] = data.data[i+1] = data.data[i+2] = g;
          }
          ctx.putImageData(data, 0, 0);
          // Set actual B&W data URL — long-press on iOS saves real B&W now
          bwImg.src = canvas.toDataURL('image/jpeg', 0.92);
        } catch {
          // CORS failed — fallback to CSS filter (visual only)
          bwImg.src = imgUrl;
          bwImg.style.filter = 'grayscale(100%)';
        }
      };
      helperLoad.onerror = () => {
        bwImg.src = imgUrl;
        bwImg.style.filter = 'grayscale(100%)';
      };
      helperLoad.src = imgUrl + (imgUrl.includes('?') ? '&' : '?') + '_t=' + Date.now();
    }

    function downloadColor() {
      if (isIOS()) {
        window.open(imgUrl, '_blank');
        return;
      }
      fetch(imgUrl)
        .then(r => r.blob())
        .then(b => triggerDownload(URL.createObjectURL(b), 'photo-color.jpg'))
        .catch(() => window.open(imgUrl, '_blank'));
    }

    function downloadBW() {
      // Load a separate hidden image with crossOrigin for canvas access
      // (separate from the display img so iOS long-press still works on display img)
      const helperImg = new Image();
      helperImg.crossOrigin = 'anonymous';
      helperImg.onload = function() {
        try {
          const canvas  = document.getElementById('canvas');
          canvas.width  = helperImg.naturalWidth;
          canvas.height = helperImg.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(helperImg, 0, 0);
          const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
          for (let i = 0; i < data.data.length; i += 4) {
            const g = data.data[i]*0.299 + data.data[i+1]*0.587 + data.data[i+2]*0.114;
            data.data[i] = data.data[i+1] = data.data[i+2] = g;
          }
          ctx.putImageData(data, 0, 0);

          if (isIOS()) {
            // Open B&W data URL in new tab → user can long-press → Save to Photos
            window.open(canvas.toDataURL('image/jpeg', 0.92), '_blank');
          } else {
            canvas.toBlob(
              b => triggerDownload(URL.createObjectURL(b), 'photo-bw.jpg'),
              'image/jpeg', 0.92
            );
          }
        } catch {
          window.open(imgUrl, '_blank');
        }
      };
      helperImg.onerror = () => window.open(imgUrl, '_blank');
      // Add timestamp to force a fresh CORS request
      helperImg.src = imgUrl + (imgUrl.includes('?') ? '&' : '?') + '_t=' + Date.now();
    }

    function downloadGif() {
      if (!gifUrl) return;
      if (isIOS()) { window.open(gifUrl, '_blank'); return; }
      fetch(gifUrl)
        .then(r => r.blob())
        .then(b => triggerDownload(URL.createObjectURL(b), 'photo.gif'))
        .catch(() => window.open(gifUrl, '_blank'));
    }

    ['touchstart', 'click'].forEach(ev => document.addEventListener(ev, () => {
      allVideos.forEach(v => { v.play().catch(() => {}); });
    }, { passive: true }));

    function loadVideoEl(src) {
      return new Promise((resolve, reject) => {
        const v = document.createElement('video');
        v.crossOrigin = 'anonymous';
        v.src = src; v.muted = true; v.loop = true; v.playsInline = true;
        v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', ''); v.setAttribute('muted', '');
        v.oncanplay = () => resolve(v);
        v.onerror = () => reject(new Error('video load failed'));
        v.load();
      });
    }
    function loadImg(src) {
      return new Promise((resolve, reject) => {
        const im = new Image(); im.crossOrigin = 'anonymous';
        im.onload = () => resolve(im);
        im.onerror = () => reject(new Error('img load failed'));
        im.src = src;
      });
    }
    function drawCover(ctx, v, dx, dy, dw, dh) {
      const vw = v.videoWidth, vh = v.videoHeight;
      if (!vw || !vh) return;
      const scale = Math.max(dw / vw, dh / vh);
      const sw = dw / scale, sh = dh / scale;
      const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
      ctx.drawImage(v, sx, sy, sw, sh, dx, dy, dw, dh);
    }

    // Composite every slot video + the frame/header/footer into ONE canvas,
    // record it, and download a single video file.
    async function compositeAndDownload() {
      const vEls = await Promise.all(vidUrls.map(loadVideoEl));
      const slots = slotsStr ? slotsStr.split(';').map(s => s.split(',').map(Number)) : null;

      let frameImg = null, headerImg = null, footerImg = null;
      if (frameUrl && slots) { try { frameImg = await loadImg(frameUrl); } catch {} }
      if (!frameImg) {
        if (headerUrl) { try { headerImg = await loadImg(headerUrl); } catch {} }
        if (footerUrl) { try { footerImg = await loadImg(footerUrl); } catch {} }
      }

      const W = 720;
      let H, drawFn;
      if (frameImg && slots) {
        H = Math.round(W * (frameImg.naturalHeight / frameImg.naturalWidth));
        drawFn = (ctx) => {
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
          vEls.forEach((v, i) => {
            const p = slots[i]; const cx = p[0], cy = p[1], w = p[2], h = p[3];
            drawCover(ctx, v, (cx - w / 2) * W, (cy - h / 2) * H, w * W, h * H);
          });
          ctx.drawImage(frameImg, 0, 0, W, H);
        };
      } else {
        const cols = gridCols();
        const rows = Math.ceil(vEls.length / cols);
        const asp = cellAspect();
        const gap = 6, pad = 6;
        const cellW = (W - pad * 2 - gap * (cols - 1)) / cols;
        const cellH = cellW * asp;
        const headerH = headerImg ? Math.round(W * (headerImg.naturalHeight / headerImg.naturalWidth)) : 0;
        const footerH = footerImg ? Math.round(W * (footerImg.naturalHeight / footerImg.naturalWidth)) : 0;
        const gridH = pad * 2 + rows * cellH + gap * (rows - 1);
        H = Math.round(headerH + gridH + footerH);
        drawFn = (ctx) => {
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
          if (headerImg) ctx.drawImage(headerImg, 0, 0, W, headerH);
          vEls.forEach((v, i) => {
            const r = Math.floor(i / cols), c = i % cols;
            const x = pad + c * (cellW + gap);
            const y = headerH + pad + r * (cellH + gap);
            drawCover(ctx, v, x, y, cellW, cellH);
          });
          if (footerImg) ctx.drawImage(footerImg, 0, H - footerH, W, footerH);
        };
      }

      H = 2 * Math.round(H / 2); // H.264 needs even dimensions
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');

      await Promise.all(vEls.map(v => v.play().catch(() => {})));

      const fps = 15;
      const durSec = Math.min(6, Math.max(2, vEls[0].duration || 3));

      let done = false;
      if (window.VideoEncoder && window.Mp4Muxer) {
        try { await encodeWebCodecs(canvas, ctx, drawFn, W, H, fps, durSec); done = true; } catch (e) {}
      }
      if (!done && window.MediaRecorder && canvas.captureStream) {
        await encodeMediaRecorder(canvas, ctx, drawFn, durSec); done = true;
      }
      vEls.forEach(v => { try { v.pause(); } catch {} });
      if (!done) throw new Error('no video encoder available');
    }

    // Real MP4 via WebCodecs — works on iOS Safari 16.4+ and Android Chrome.
    async function encodeWebCodecs(canvas, ctx, drawFn, W, H, fps, durSec) {
      const muxer = new Mp4Muxer.Muxer({
        target: new Mp4Muxer.ArrayBufferTarget(),
        video: { codec: 'avc', width: W, height: H },
        fastStart: 'in-memory',
      });
      let encErr = null;
      const encoder = new VideoEncoder({
        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
        error: (e) => { encErr = e; },
      });
      encoder.configure({ codec: 'avc1.42001f', width: W, height: H, bitrate: 3000000, framerate: fps });

      const total = Math.round(fps * durSec);
      const frameDurUs = Math.round(1e6 / fps);
      for (let i = 0; i < total; i++) {
        if (encErr) throw encErr;
        drawFn(ctx);
        const frame = new VideoFrame(canvas, { timestamp: i * frameDurUs, duration: frameDurUs });
        encoder.encode(frame, { keyFrame: i % fps === 0 });
        frame.close();
        await new Promise(r => setTimeout(r, 1000 / fps));
      }
      await encoder.flush();
      encoder.close();
      if (encErr) throw encErr;
      muxer.finalize();
      triggerDownload(URL.createObjectURL(new Blob([muxer.target.buffer], { type: 'video/mp4' })), 'photo-live.mp4');
    }

    // Fallback for older Android: MediaRecorder.
    async function encodeMediaRecorder(canvas, ctx, drawFn, durSec) {
      const stream = canvas.captureStream(30);
      const mime = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4'
                 : MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9'
                 : 'video/webm';
      const rec = new MediaRecorder(stream, { mimeType: mime });
      const chunks = [];
      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      const stopped = new Promise(res => { rec.onstop = res; });
      let raf;
      const loop = () => { drawFn(ctx); raf = requestAnimationFrame(loop); };
      loop();
      rec.start();
      await new Promise(r => setTimeout(r, durSec * 1000));
      rec.stop();
      cancelAnimationFrame(raf);
      await stopped;
      const ext = mime.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
      triggerDownload(URL.createObjectURL(new Blob(chunks, { type: mime })), 'photo-live.' + ext);
    }

    function downloadVid() {
      if (liveUrl) {
        if (isIOS()) { window.open(liveUrl, '_blank'); return; }
        fetch(liveUrl).then(r => r.blob())
          .then(b => triggerDownload(URL.createObjectURL(b), 'photo-live.mp4'))
          .catch(() => window.open(liveUrl, '_blank'));
        return;
      }
      if (vidUrls.length === 0) return;
      const btn = document.querySelector('.live-btn');
      const label = btn ? btn.textContent : '';
      if (btn) { btn.textContent = 'Processing…'; btn.disabled = true; }
      compositeAndDownload()
        .catch(() => {
          const u = vidUrls[0];
          if (isIOS()) { window.open(u, '_blank'); return; }
          return fetch(u).then(r => r.blob())
            .then(b => triggerDownload(URL.createObjectURL(b), 'photo-live.mp4'))
            .catch(() => window.open(u, '_blank'));
        })
        .finally(() => { if (btn) { btn.textContent = label; btn.disabled = false; } });
    }

    function triggerDownload(url, name) {
      const a = document.createElement('a');
      a.href = url; a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  </script>
</body>
</html>
